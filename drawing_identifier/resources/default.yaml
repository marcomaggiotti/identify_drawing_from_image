# Default configuration for drawing_identifier.
# Copy configs/example.yaml, edit it and pass it with `drawid --config my.yaml ...`.
# Anything not set in your file falls back to the values below.

# Which VLM profile the agents use by default.
#   "auto"  -> first available profile in `auto_preference` (API key present / server reachable)
#   "none"  -> classical computer vision + local models only
#   <name>  -> a profile below, or an ad-hoc spec "provider:model[@base_url]"
default_vlm: auto
auto_preference: [claude, gpt, gemini, ollama-qwen, vllm-qwen]

# Optional per-agent VLM selection (agent name -> profile/spec). Example:
#   agent_vlms: {text_reader: ollama-qwen, verifier: claude, planner: claude}
agent_vlms: {}

vlms:
  claude:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
  claude-sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
  claude-haiku:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
  gpt:
    provider: openai
    model: gpt-5
    api_key_env: OPENAI_API_KEY
    max_tokens: 8192
  gemini:
    provider: gemini
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
  ollama-qwen:
    provider: ollama
    model: qwen2.5vl:7b
    base_url: http://localhost:11434
  ollama-llama:
    provider: ollama
    model: llama3.2-vision
    base_url: http://localhost:11434
    max_images_per_call: 1
  vllm-qwen:
    provider: openai_compatible
    model: Qwen/Qwen2.5-VL-7B-Instruct
    base_url: http://localhost:8000/v1
    api_key_env: VLLM_API_KEY
  hf-qwen:
    provider: hf
    model: Qwen/Qwen2.5-VL-3B-Instruct
    max_image_side: 1280
  # A Qwen2.5-VL LoRA fine-tuned on the synthetic dataset (see `drawid finetune-vlm`).
  local-finetuned:
    provider: hf
    model: Qwen/Qwen2.5-VL-3B-Instruct
    max_image_side: 1024
    extra:
      adapter_path: runs/vlm-lora
  mock:
    provider: mock
    model: mock

orchestrator:
  mode: pipeline          # pipeline | planner (a VLM decides which agent runs next)
  max_steps: 20
  stop_if_not_drawing: false

preprocess:
  max_side: 1800
  crop_page: true
  orientation: auto       # auto | none | 0 | 90 | 180 | 270 (clockwise)
  orientation_use_vlm: true
  remove_rules: true

shapes:
  detector: cv            # cv | yolo | cv+yolo
  weights: null           # path to YOLO weights trained with `drawid train-detector`
  yolo_conf: 0.35
  min_shape_scale: 7.0    # min shape size in stroke widths
  gap_close_scale: 2.0    # close pen gaps up to this many stroke widths
  fit_threshold: 0.86     # min IoU between region and fitted primitive to call it a shape
  keep_subregions: false
  max_merge: 3

connections:
  min_line_scale: 10.0    # min connector length in stroke widths
  heavy_ratio: 1.6        # stroke-width ratio that marks a heavy line (line of identity)
  attach_scale: 3.0       # endpoint attachment tolerance in stroke widths

text:
  near_scale: 2.5         # "near" distance in text heights
  ocr: vlm                # vlm | trocr | tesseract | none
  batch_size: 6           # crops per VLM call (sheet mode for single-image VLMs)
  crop_pad: 6
  max_items: 150          # cap on text regions read per image (shape labels first)

vlm_analyst:
  enabled: true

verifier:
  enabled: true
  max_rounds: 2
